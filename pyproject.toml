[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subsidence-rebuild"
version = "0.7.0"
description = "Subsidence prediction and calibration with a local scientific desktop workbench"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6", "matplotlib==3.10.8", "scipy==1.17.1"]

[project.scripts]
subsidence = "subsidence.cli:main"
subsidence-gui = "subsidence.desktop:launch"

[tool.setuptools.packages.find]
include = ["subsidence*"]
