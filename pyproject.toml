[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subsidence-rebuild"
version = "0.1.0"
description = "Reproducible subsidence project: geometry and independent meshes"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6"]

[project.scripts]
subsidence = "subsidence.cli:main"

[tool.setuptools.packages.find]
include = ["subsidence*"]
